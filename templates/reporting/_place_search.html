{# Place search, used by the map page and the edit page. Wired up in map.js. #}
<div class="rp-search" data-place-search>
  <label class="rp-search__label" for="rp-search-input">Search for a place</label>
  <div class="rp-search__bar">
    <input type="search"
           id="rp-search-input"
           class="rp-search__input"
           placeholder="e.g. Stasiun UI, Margonda, Kantin FASILKOM"
           autocomplete="off"
           aria-describedby="rp-search-status">
    <button type="button" class="rp-btn rp-search__btn">Search</button>
  </div>
  <p class="rp-search__status" id="rp-search-status" aria-live="polite"></p>
  <ul class="rp-search__results" role="listbox" aria-label="Search results" hidden></ul>
</div>
